---
- name: Prevent nouveau from claiming NVIDIA GPUs on boot
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0
  register: nouveau_blacklist
  when: gpu_runtime_disable_nouveau | bool

- name: Rebuild initramfs after changing the nouveau policy
  ansible.builtin.command: update-initramfs -u -k all
  when:
    - gpu_runtime_disable_nouveau | bool
    - nouveau_blacklist.changed

- name: Check whether nouveau is currently loaded
  ansible.builtin.shell: |
    set -eu
    if grep -q '^nouveau ' /proc/modules; then
      echo loaded
    else
      echo absent
    fi
  register: nouveau_module_state
  changed_when: false
  when: gpu_runtime_disable_nouveau | bool

- name: Report reboot requirement for an active nouveau module
  ansible.builtin.debug:
    msg: >-
      nouveau is currently loaded. Reboot the node before allowing NVIDIA GPU
      Operator to install or upgrade its managed driver.
  when:
    - gpu_runtime_disable_nouveau | bool
    - nouveau_module_state.stdout == "loaded"

- name: Install NVIDIA Container Toolkit prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: gpu_runtime_install_nvidia_toolkit | bool

- name: Add NVIDIA Container Toolkit keyring
  ansible.builtin.shell: |
    set -eu
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  when: gpu_runtime_install_nvidia_toolkit | bool

- name: Add NVIDIA Container Toolkit apt repository
  ansible.builtin.shell: |
    set -eu
    distribution=$(. /etc/os-release; echo "${ID}${VERSION_ID}")
    curl -fsSL "https://nvidia.github.io/libnvidia-container/${distribution}/libnvidia-container.list" \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  when: gpu_runtime_install_nvidia_toolkit | bool

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  when: gpu_runtime_install_nvidia_toolkit | bool

- name: Check for nvidia-smi
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_result
  changed_when: false
  failed_when: false

- name: Show GPU discovery result
  ansible.builtin.debug:
    msg: "{{ nvidia_smi_result.stdout_lines | default(['nvidia-smi not available']) }}"
