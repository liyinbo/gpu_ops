---
# Dev-sized PostgreSQL: one replica on local-path. This deliberately diverges from the
# production instance, which uses the CNPG operator with three instances — the GPU cluster
# has no postgres operator, and a dev instance does not need HA. What it holds is
# recreatable: sessions, events and approvals for throwaway experiments. Workspace trees
# live on the node agent's own volume either way (meta_harness ADR 0017).
apiVersion: v1
kind: Service
metadata:
  name: meta-harness-pg
  namespace: meta-harness
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: meta-harness-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meta-harness-pg
  namespace: meta-harness
spec:
  serviceName: meta-harness-pg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meta-harness-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meta-harness-pg
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: meta_harness
            - name: POSTGRES_USER
              value: meta_harness
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meta-harness
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "meta_harness", "-d", "meta_harness"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
