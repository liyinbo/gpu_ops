---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meta-harness
  namespace: meta-harness
spec:
  interval: 30m
  chart:
    spec:
      chart: meta-harness
      version: "0.2.1"
      sourceRef:
        kind: HelmRepository
        name: meta-harness
        namespace: meta-harness
  values:
    image:
      repository: forgejo.home.hope-leniency.com/limbo/meta-harness
      tag: "1875133"
    imagePullSecrets:
      - name: forgejo-registry

    # A node's websocket lands on exactly one API pod and the hub routing to it is
    # process-local; the chart refuses to render with more.
    replicaCount:
      api: 1

    externalDatabase:
      existingSecret: meta-harness
      urlKey: DATABASE_URL
    nodeRelay:
      existingSecret: meta-harness
      secretKey: NODE_RELAY_SECRET
    appSecrets:
      existingSecret: meta-harness
      bundleSigningKey: BUNDLE_SIGNING_SECRET
      bundleTokenKey: BUNDLE_TOKEN_SECRET

    # The execution site (meta_harness ADR 0017): workspaces are created on this volume at
    # connect time, and the control plane never reads that tree as a path.
    node:
      enabled: true
      name: cluster
      existingSecret: meta-harness
      tokenKey: NODE_TOKEN
      labels:
        - "os:linux"
        - "shell:sh"
      tools:
        - workspace.create
        - workspace.prepare
        - git.init
        - git.clone
        - git.summary
        - git.write
        - git.branch
        - git.commit
        - git.push
        - files.list
        - files.read
        - files.read_bytes
        - files.write
        - files.search
        - files.glob
        - patch.build
        - patch.apply
        - shell.exec
        - web.fetch
        - web.search
      storage:
        size: 20Gi
        storageClass: local-path
        mountPath: /var/lib/meta-harness/workspaces
    defaultWorkspaceNode: cluster

    enabledHands:
      - files
      - git
      - sandbox
      - nodes
      - packages
      - brain
      - vault
      - terminal
    sandbox:
      backend: kubernetes

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: meta-harness-dev.home.hope-leniency.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: meta-harness-dev-home-hope-leniency-com-tls
          hosts:
            - meta-harness-dev.home.hope-leniency.com
