---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meta-harness
  namespace: meta-harness
spec:
  interval: 30m
  chart:
    spec:
      chart: meta-harness
      version: "0.3.4"
      sourceRef:
        kind: HelmRepository
        name: meta-harness
        namespace: meta-harness
  values:
    image:
      repository: forgejo.home.hope-leniency.com/limbo/meta-harness
      tag: "0.3.4"
    imagePullSecrets:
      - name: forgejo-registry

    # A node's websocket lands on exactly one API pod and the hub routing to it is
    # process-local; the chart refuses to render with more.
    replicaCount:
      api: 1

    auth:
      # Shared Authentik provider with the production instance. This externally reachable
      # deployment is OIDC-only; the API rejects local profile authentication as well.
      localAuthEnabled: false
      oidc:
        enabled: true
        issuerUrl: https://auth.home.hope-leniency.com/application/o/meta-harness/
        clientId: zCH850HtEcwGgsdScMk06n3KBHFQcS6VFErWMTdQ
        redirectUri: https://meta-harness-dev.home.hope-leniency.com/auth/oidc/callback
        existingSecret: meta-harness-oidc
        clientSecretKey: OIDC_CLIENT_SECRET

    externalDatabase:
      existingSecret: meta-harness
      urlKey: DATABASE_URL
    nodeRelay:
      existingSecret: meta-harness
      secretKey: NODE_RELAY_SECRET
    appSecrets:
      existingSecret: meta-harness
      bundleSigningKey: BUNDLE_SIGNING_SECRET
      bundleTokenKey: BUNDLE_TOKEN_SECRET

    vault:
      enabled: true
      url: https://vault.vault.svc:8200
      mount: meta-harness-dev
      authRole: meta-harness-workspace-broker-dev
      authMount: kubernetes
      referencesJson: '{"vault:tests/credential-resolve":"tests/credential-resolve"}'
      ca:
        existingSecret: meta-harness-vault-ca
        key: ca.crt
        mountPath: /var/run/meta-harness/vault-ca

    providers:
      # Insert-only, secret-free seed metadata. Brain administrators own later provider
      # edits; the provider key remains write-only through the Vault hand.
      seedJson: |
        [{"id":"claude-live","label":"Claude","protocol":"anthropic-messages","baseUrl":"https://api.anthropic.com","models":["claude-sonnet-5"],"credentialRef":"vault:providers/claude","default":true}]
      # Exact destinations to which a Brain administrator may direct provider credentials.
      endpointAllowlist:
        - https://api.anthropic.com
      defaultEngine: claude-live
      mockEngineEnabled: false
      vault:
        enabled: true
        url: https://vault.vault.svc:8200
        mount: meta-harness-dev
        referencesJson: '{"vault:providers/claude":"providers/claude"}'
        authMount: kubernetes
        authAudience: vault
        ingest:
          authRole: meta-harness-credential-ingest
        worker:
          authRole: meta-harness-worker
        ca:
          existingSecret: meta-harness-vault-ca
          key: ca.crt
          mountPath: /var/run/meta-harness/vault-provider-ca

    # The execution site (meta_harness ADR 0017): workspaces are created on this volume at
    # connect time, and the control plane never reads that tree as a path.
    node:
      enabled: true
      name: cluster
      existingSecret: meta-harness
      tokenKey: NODE_TOKEN
      labels:
        - "os:linux"
        - "shell:sh"
      tools:
        - workspace.create
        - workspace.prepare
        - git.init
        - git.clone
        - git.summary
        - git.write
        - git.branch
        - git.commit
        - git.push
        - files.list
        - files.read
        - files.read_bytes
        - files.write
        - files.search
        - files.glob
        - patch.build
        - patch.apply
        - shell.exec
        - web.fetch
        - web.search
      storage:
        size: 20Gi
        storageClass: local-path
        mountPath: /var/lib/meta-harness/workspaces
    defaultWorkspaceNode: cluster

    enabledHands:
      - files
      - git
      - sandbox
      - nodes
      - packages
      - brain
      - vault
      - terminal
    sandbox:
      backend: kubernetes

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: meta-harness-dev.home.hope-leniency.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: meta-harness-dev-home-hope-leniency-com-tls
          hosts:
            - meta-harness-dev.home.hope-leniency.com
