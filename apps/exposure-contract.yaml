# Machine-readable private HTTPS exposure contract.
# Hostname ownership and LAN DNS records are coordinated in network-ops.
apps:
  - name: tts
    hostname: tts.home.hope-leniency.com
    ingressIP: 192.168.8.130
    namespace: tts
    ingressResource: tts-ingress
    certificateSecret: tts-home-hope-leniency-com-tls
    certificateNamespace: tts
    port: 443
    phase: planned
    notes: Qwen3 TTS web UI and API on the GPU cluster. DNS should map this hostname to the GPU cluster Traefik endpoint unless a different ingress VIP is assigned.

  - name: meta-harness-dev
    hostname: meta-harness-dev.home.hope-leniency.com
    ingressIP: 192.168.8.130
    namespace: meta-harness
    ingressResource: meta-harness
    certificateSecret: meta-harness-dev-home-hope-leniency-com-tls
    certificateNamespace: meta-harness
    port: 443
    phase: planned
    notes: Development instance of the agent control plane. Its execution site is an in-cluster node agent owning workspace storage on its own volume; the production instance lives on the storage cluster.
