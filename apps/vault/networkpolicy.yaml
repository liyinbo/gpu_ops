---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-server
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: meta-harness
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes Service address before DNAT.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # k3s evaluates this policy after Service DNAT, so the same API request reaches the
    # single control-plane endpoint on its secure port.
    - to:
        - ipBlock:
            cidr: 192.168.8.130/32
      ports:
        - protocol: TCP
          port: 6443
    # Authentik OIDC discovery and token exchange for the restricted human operator role.
    - to:
        - ipBlock:
            cidr: 192.168.8.20/32
      ports:
        - protocol: TCP
          port: 443
