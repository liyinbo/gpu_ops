---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned-bootstrap
  namespace: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-ca
  namespace: vault
spec:
  isCA: true
  commonName: gpu-vault-internal-ca
  secretName: vault-internal-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: vault-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-internal-ca
  namespace: vault
spec:
  ca:
    secretName: vault-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  secretName: vault-server-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-0.vault-internal.vault.svc
    - vault-0.vault-internal.vault.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: vault-internal-ca
